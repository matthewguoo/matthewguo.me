<!doctype html>
<html lang="en">
<head>
<title>Book a call · matthewguo.me</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f5f5"><link rel="icon" href="/favicon.ico" sizes="32x32 48x48"><link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>:root{--sakura:#8e2130;--ink:#1a1a1a;--ink-2:#333;--muted-1:#555;--muted-3:#888;--bg:#f5f5f5;--surface:#fff;--line:#1a1a1a24;--line-soft:#1a1a1a14;--font-display:Inter,system-ui,-apple-system,sans-serif;--font-body:"Noto Sans JP",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh}body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:var(--sakura);z-index:2}.page{max-width:1100px;margin:0 auto;padding:0 28px;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:flex-end;padding:22px 0;border-bottom:1px solid var(--line-soft);font-family:var(--font-display);font-size:13px}a{color:var(--muted-1);text-decoration:none}a:hover{color:var(--sakura)}main{flex:1;padding:48px 0;max-width:560px}h1{font-family:var(--font-display);font-size:clamp(26px,3.4vw,36px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}p{margin:0 0 14px;color:var(--muted-1)}form{border:1px solid var(--line);background:var(--surface)}.f{display:grid;grid-template-columns:96px 1fr;border-bottom:1px solid var(--line-soft)}.f label{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);padding:12px 14px;border-right:1px solid var(--line-soft)}.f input,.f textarea,.f select{font:inherit;font-size:14px;color:var(--ink);border:0;outline:0;background:transparent;padding:10px 14px;width:100%;resize:vertical}.f textarea{min-height:140px}.f input:focus,.f textarea:focus,.f select:focus{background:#f9f5f9}.act{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}.act button{font:inherit;font-family:var(--font-display);font-size:13px;font-weight:500;color:#fff;background:var(--sakura);border:0;padding:9px 16px;cursor:pointer}.act button:disabled{opacity:.5;cursor:default}.act span{font-size:13px;color:var(--muted-3)}.done{border:1px solid var(--line);background:var(--surface);padding:16px 18px}.done pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--muted-1);margin:10px 0 0}.err{color:var(--sakura)}footer{padding:18px 0 24px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted-3)}.hp{position:absolute;left:-9999px}</style>
</head>
<body>
<div class="page">
  <header><nav><a href="/">Home</a></nav></header>
  <main>
    <h1>Book a call with Matthew</h1>
    <p>Pick a slot, say what it's about, and request it. He confirms by email, usually within a day.</p>
    <form id="f" autocomplete="on">
      <div class="f"><label for="st">Slot</label><select id="st" name="start" required><option value="">Loading open slots…</option></select></div>
      <div class="f"><label for="du">Length</label><select id="du" name="duration_minutes"><option value="30">30 minutes</option><option value="15">15 minutes</option></select></div>
      <div class="f"><label for="n">Name</label><input id="n" name="name" maxlength="100" placeholder="optional"></div>
      <div class="f"><label for="r">Email</label><input id="r" name="reply_to" type="email" maxlength="200" required></div>
      <div class="f"><label for="t">Topic</label><textarea id="t" name="topic" maxlength="500" required style="min-height:90px"></textarea></div>
      <input class="hp" name="website" tabindex="-1" autocomplete="off">
      <div class="act"><span id="s">Times are shown in your timezone and his.</span><button type="submit" id="b">Request call</button></div>
    </form>
    <div class="done" id="d" hidden></div>
  </main>
  <footer>© 2026 Matthew Guo</footer>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), g=function(k){return q.get(k)||''};
  document.getElementById('n').value=g('n'); document.getElementById('r').value=g('r'); document.getElementById('t').value=g('t');
  if(g('d')==='15') document.getElementById('du').value='15';
  var f=document.getElementById('f'), b=document.getElementById('b'), s=document.getElementById('s'), d=document.getElementById('d'), sel=document.getElementById('st');
  var want=g('start'); var myTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  fetch('/api/submit?kind=availability').then(function(r){return r.json()}).then(function(a){
    sel.innerHTML=''; var found=false;
    a.slots.forEach(function(x){ var o=document.createElement('option'); o.value=x.start; var mine=new Date(x.start).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); o.textContent=mine+'  ·  '+x.local; if(want&&new Date(want).getTime()===new Date(x.start).getTime()){o.selected=true;found=true;} sel.appendChild(o); });
    if(!a.slots.length){ var o=document.createElement('option'); o.value=''; o.textContent='No open slots in the next two weeks'; sel.appendChild(o); }
    if(want&&!found) s.textContent='The suggested slot is no longer open; pick another.';
    else s.textContent='Your timezone: '+myTz+'. His: '+a.timezone+'.';
  }).catch(function(){ sel.innerHTML='<option value="">Could not load slots</option>'; });
  f.addEventListener('submit',function(e){
    e.preventDefault(); if(!sel.value) return; b.disabled=true; s.textContent='Requesting…'; s.className='';
    var body={kind:'call',start:sel.value,duration_minutes:Number(f.duration_minutes.value),name:f.name.value,reply_to:f.reply_to.value,topic:f.topic.value,timezone:myTz,website:f.website.value};
    fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){
      if(j.ok){ f.hidden=true; d.hidden=false; d.textContent=j.result.text; var a=document.createElement('a'); a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(j.result.ics); a.download='call-with-matthew-guo.ics'; a.textContent='Add to your calendar (.ics, tentative)'; a.style.display='block'; a.style.marginTop='10px'; d.appendChild(a); }
      else { b.disabled=false; s.textContent=j.error||'Something went wrong.'; s.className='err'; }
    }).catch(function(){ b.disabled=false; s.textContent='Network error. Try again.'; s.className='err'; });
  });
})();
</script>
</body>
</html>
