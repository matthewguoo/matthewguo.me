<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew Guo</title>
<meta name="description" content="Matthew Guo">
<meta name="theme-color" content="#f5f5f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sakura:#8e2130; --ink:#1a1a1a; --ink-2:#333; --muted-1:#555; --muted-3:#888;
    --bg:#f5f5f5; --line-soft:#1a1a1a14;
    --font-display:Inter, system-ui, -apple-system, sans-serif;
    --font-body:"Noto Sans JP", Inter, system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:var(--font-body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100dvh; position:relative; }
  body::before { content:""; position:fixed; top:0; left:0; right:0; height:3px; background:var(--sakura); z-index:2; }
  .guilloche { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05; color:var(--ink);
    background:url(/assets/guilloche.svg) top center / auto 150vh repeat; }
  @media (max-width:720px) { .guilloche { opacity:.04; background-size:auto 110vh; } }
  .page { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:0 28px; min-height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; justify-content:space-between; padding:22px 0; border-bottom:1px solid var(--line-soft); font-family:var(--font-display); font-size:13px; }
  header .name { font-weight:600; color:var(--ink); }
  header nav { display:flex; gap:20px; }
  a { color:var(--muted-1); text-decoration:none; }
  a:hover { color:var(--sakura); }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:60px 0; }
  h1 { font-family:var(--font-display); font-size:clamp(32px, 5vw, 56px); font-weight:600; letter-spacing:-0.025em; line-height:1.05; margin:0; }
  footer { padding:18px 0 24px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--muted-3); }
</style>
</head>
<body>
<div class="guilloche" aria-hidden="true"></div>
<div class="page">
  <header>
    <a class="name" href="/">Matthew Guo</a>
    <nav>
      <a href="https://github.com/matthewguoo" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/matthewguoo/" rel="noopener">LinkedIn</a>
    </nav>
  </header>
  <main>
    <h1>Matthew Guo</h1>
  </main>
  <footer>© 2026</footer>
</div>
</body>
</html>
